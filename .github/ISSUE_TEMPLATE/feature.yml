name: Feature
description: Demande de fonctionnalité ou tâche de développement
labels: []
body:
  - type: dropdown
    id: area
    attributes:
      label: Zone
      options:
        - area:client
        - area:ai
        - area:data
        - area:infra
        - area:docs
