name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ai-and-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e "./ai-server[dev]" -e "./data[dev]"
      - name: Ruff
        run: |
          .venv/bin/ruff check ai-server/src ai-server/tests data/src data/tests
          .venv/bin/ruff format --check ai-server/src ai-server/tests data/src data/tests
      - name: Pytest
        run: .venv/bin/pytest ai-server/tests data/tests -q

  # gdlint is optional; skip if godot-gdscript-toolkit not trivial to pin
  client-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Godot project files
        run: |
          test -f client/project.godot
          test -f client/scenes/main.tscn
          test -f client/scripts/npc_dialog.gd
